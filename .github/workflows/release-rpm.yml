name: Release RPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example 1.2.0)"
        required: true
        type: string
      release:
        description: "RPM release number"
        required: false
        default: "1"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-rpm:
    name: Build and publish RPM
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_RELEASE: ${{ inputs.release }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v6

      - name: Build RPM
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="v${INPUT_VERSION}"
            rpm_release="$INPUT_RELEASE"
            release_tag="$version"
          else
            release_tag="$GITHUB_REF_NAME"
            version="$release_tag"
            rpm_release="1"
          fi

          if [[ ! "$version" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Version must be a v-prefixed numeric tag such as v1.2.0." >&2
            exit 2
          fi

          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$file_version" != "$version" ]; then
            echo "VERSION ($file_version) must match the release version ($version)." >&2
            exit 2
          fi

          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e VERSION="$version" \
            -e RELEASE="$rpm_release" \
            -e RPM_DIST=".el9" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            rockylinux:9 \
            bash -lc '
              set -euo pipefail
              trap '\''chown -R "$HOST_UID:$HOST_GID" artifacts 2>/dev/null || true'\'' EXIT
              dnf install -y rpm-build make nodejs npm git tar xz findutils
              git config --global --add safe.directory /src
              ./rpm-builder.sh --version "$VERSION" --release "$RELEASE"
            '

      - name: Collect RPM files
        run: |
          set -euo pipefail
          find artifacts/rpm -maxdepth 1 -type f \( -name "*.rpm" -o -name "*.src.rpm" \) -print
          test -n "$(find artifacts/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="v${INPUT_VERSION}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" artifacts/rpm/*.rpm --clobber
          else
            gh release create "$release_tag" artifacts/rpm/*.rpm \
              --title "ablestack-cockpit-plugin ${release_tag}" \
              --generate-notes
          fi
